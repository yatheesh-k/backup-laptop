#Deployment.yaml file

# Employee Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-deployment
  labels:
    app: ems-employee
spec:
  replicas: 3  # Number of replicas for the employee service
  selector:
    matchLabels:
      app: ems-employee
  template:
    metadata:
      labels:
        app: ems-employee
    spec:
      containers:
        - name: employee-container
          image: yatheesh836/ems:e-i  # Docker image for the employee service
          ports:
            - containerPort: 8191  # Expose port 8191 for employee service

---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
spec:
  selector:
    app: ems-employee  # Match the app label from the deployment
  ports:
    - protocol: TCP
      port: 8081   # Port exposed by the service
      targetPort: 8191  # Port the container listens on
  type: LoadBalancer  # Expose externally using LoadBalancer (can use NodePort or ClusterIP as needed)

