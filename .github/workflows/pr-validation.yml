name: PR Validation (Java + Node)

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #### ---- Node.js Tests (React UI) ---- ####
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node.js dependencies
        working-directory: ./ui
        run: |
          npm install
          npm install --save-dev jest babel-jest @babel/preset-env @babel/preset-react

      - name: Create Babel & Jest config
        working-directory: ./ui
        run: |
          echo "module.exports = {
            presets: ['@babel/preset-env', '@babel/preset-react']
          };" > babel.config.js

          echo "module.exports = {
            testEnvironment: 'jsdom',
            transform: {
              '^.+\\\\.(js|jsx)$': 'babel-jest'
            },
            moduleFileExtensions: ['js', 'jsx']
          };" > jest.config.js

      - name: Run Node.js tests
        working-directory: ./ui
        run: CI=false npm test

      #### ---- Java Tests ---- ####
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and test employee service
        working-directory: ./employee
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install
          elif [ -f "build.gradle" ]; then
            ./gradlew build
          else
            echo "No build tool found in employee"
            exit 1
          fi

      - name: Build and test identity service
        working-directory: ./identity
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install
          elif [ -f "build.gradle" ]; then
            ./gradlew build
          else
            echo "No build tool found in identity"
            exit 1
          fi

      - name: Build and test invoice service
        working-directory: ./invoice
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install
          elif [ -f "build.gradle" ]; then
            ./gradlew build
          else
            echo "No build tool found in invoice"
            exit 1
          fi
