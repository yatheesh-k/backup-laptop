name: PR Validation (Java + Node)

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #### ---- Node.js Tests (React) ---- ####
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Babel and Jest config for ESM
        working-directory: ./frontend
        run: |
          npm install --save-dev babel-jest @babel/preset-env @babel/preset-react

          # Create babel.config.js
          echo "module.exports = {
            presets: ['@babel/preset-env', '@babel/preset-react']
          };" > babel.config.js

          # Create jest.config.js
          echo "module.exports = {
            testEnvironment: 'jsdom',
            transform: {
              '^.+\\\\.(js|jsx)$': 'babel-jest'
            },
            moduleFileExtensions: ['js', 'jsx']
          };" > jest.config.js

      - name: Run Node.js tests
        working-directory: ./frontend
        run: CI=false npm test

      #### ---- Java Tests ---- ####
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and test Java code (Maven or Gradle)
        working-directory: ./backend
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install
          elif [ -f "build.gradle" ]; then
            ./gradlew build
          else
            echo "No build tool found"
            exit 1
          fi

      #### ---- Check for Required Files ---- ####
      - name: Ensure required files exist
        run: |
          required_files=(
            "./frontend/src/App.test.js"
            "./backend/src/test/java/com/example/AppTest.java"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done

            fi
          done

